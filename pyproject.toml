[project]
name = "bible-bilingual-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.0",
    "fastapi>=0.140.7",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langchain-community<0.4",
    "langchain-core>=1.5.1",
    "langchain-google-vertexai>=3.2.4",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.9",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "ragas>=0.4.3",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.1",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126" }
]
